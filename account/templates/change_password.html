{% extends 'base.html' %}
{% block title %}Change Password - Dr Apple Store{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-4">🔑 Change Password</h2>

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="{{ form.password1.id_for_label }}" class="form-label">New Password</label>
                            {{ form.password1 }}
                            <small class="text-muted">{{ form.password1.help_text|safe }}</small>
                        </div>

                        <div class="mb-4">
                            <label for="{{ form.password2.id_for_label }}" class="form-label">Confirm Password</label>
                            {{ form.password2 }}
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100">Change Password</button>
                    </form>

                    <hr class="my-4">
                    <p class="text-center"><a href="{% url 'account:dashboard' %}">Back to Dashboard</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
