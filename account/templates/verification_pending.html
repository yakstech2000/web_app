{% extends 'base.html' %}
{% block title %}Verify Email - Dr Apple Store{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card shadow">
                <div class="card-body p-5 text-center">
                    <h2 class="mb-4">📧 Verify Your Email</h2>
                    <p>We've sent a verification link to your email. Please click the link to activate your account.</p>
                    <p>The link expires in 24 hours.</p>

                    <form method="post" action="{% url 'account:resend-verification' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-primary btn-lg">Resend Verification Email</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
