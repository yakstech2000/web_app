{% extends 'base.html' %}
{% block title %}Edit Profile - Dr Apple Store{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-4">✏Edit Profile</h2>

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="{{ form.email.id_for_label }}" class="form-label">Email</label>
                            {{ form.email }}
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="{{ form.first_name.id_for_label }}" class="form-label">First Name</label>
                                {{ form.first_name }}
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="{{ form.last_name.id_for_label }}" class="form-label">Last Name</label>
                                {{ form.last_name }}
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100">Save Changes</button>
                    </form>

                    <hr class="my-4">
                    <p class="text-center"><a href="{% url 'account:dashboard' %}">Back to Dashboard</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
